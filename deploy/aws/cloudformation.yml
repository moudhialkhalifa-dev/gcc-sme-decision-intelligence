AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GCC SME Decision Intelligence - single EC2 host running Docker Compose (PostgreSQL + API + dashboard),
  with a monthly AWS Budget alert. NOT YET DEPLOYED BY THE AUTHOR OF THIS TEMPLATE: validate with
  `aws cloudformation validate-template` and review before creating the stack.

Parameters:
  RepoUrl:
    Type: String
    Description: HTTPS git URL of this repository (must be readable by the instance, e.g. a public GitHub repo).
  RepoRef:
    Type: String
    Default: main
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: The 1M-row case study peaks at about 1 GB of RAM in the pipeline; t3.medium (4 GB) leaves headroom.
  AllowedCidr:
    Type: String
    Description: CIDR allowed to reach the dashboard on port 80. Use your own IP (x.x.x.x/32) unless the demo must be public.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  ApiKey:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Access key the dashboard will ask for (sent as X-API-Key).
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    AllowedPattern: '^[A-Za-z0-9]+$'
  BudgetEmail:
    Type: String
    Description: Email that receives budget alerts.
  MonthlyBudgetUsd:
    Type: Number
    Default: 40
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore   # shell access through Session Manager; no SSH port

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Dashboard HTTP from the allowed range only
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedCidr }

  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: sme-decision-intelligence }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker git
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          git clone --depth 1 --branch "${RepoRef}" "${RepoUrl}" /opt/sme-di
          cd /opt/sme-di
          umask 077
          cat > .env <<ENV
          POSTGRES_PASSWORD=${DbPassword}
          API_KEY=${ApiKey}
          HTTP_PORT=80
          ENV
          sed -i 's/^ *//' .env
          docker compose up -d --build

  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  DashboardUrl:
    Value: !Sub "http://${Host.PublicDnsName}/"
    Description: Open after about 10 minutes (the first boot builds the image). Check /api/health first.
  InstanceId:
    Value: !Ref Host
